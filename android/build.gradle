allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// --- Patch: paksa semua subproject (termasuk plugin seperti flutter_timezone)
// pakai JVM target Java/Kotlin yang sama (17), supaya tidak ada lagi error
// "Inconsistent JVM-target compatibility detected for tasks
//  compileReleaseJavaWithJavac / compileReleaseKotlin".
// Menggunakan plugins.withId (bukan afterEvaluate) supaya tidak konflik
// dengan urutan evaluasi project.
subprojects {
    plugins.withId("com.android.application") {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    plugins.withId("com.android.library") {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
