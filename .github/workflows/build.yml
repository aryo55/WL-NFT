name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project structure
        run: |
          mkdir -p /tmp/src
          cp -r lib /tmp/src/
          cp -r assets /tmp/src/
          cp pubspec.yaml /tmp/src/
          flutter create . --project-name nft_wl_tracker --platforms android
          rm -rf lib assets pubspec.yaml
          cp -r /tmp/src/lib .
          cp -r /tmp/src/assets .
          cp /tmp/src/pubspec.yaml .

      - name: Install dependencies
        run: flutter pub get

      - name: Allow opening browser links (Android 11+ package visibility)
        run: |
          sed -i 's|<application|<queries><intent><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="https" /></intent></queries><application|' android/app/src/main/AndroidManifest.xml

      - name: Set app display name
        run: |
          sed -i 's|android:label="nft_wl_tracker"|android:label="Jadwal Mint NFT"|' android/app/src/main/AndroidManifest.xml

      - name: Add notification permissions & receivers
        run: |
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>|' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" /><receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/><action android:name="android.intent.action.QUICKBOOT_POWERON" /><action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/></intent-filter></receiver></application>|' android/app/src/main/AndroidManifest.xml

      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          sed -i 's|targetCompatibility = JavaVersion.VERSION_1_8|targetCompatibility = JavaVersion.VERSION_1_8\n        isCoreLibraryDesugaringEnabled = true|' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts << 'EOF'

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}
EOF

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nft-wl-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
