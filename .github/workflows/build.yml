name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project structure
        run: |
          mkdir -p /tmp/src
          cp -r lib /tmp/src/
          cp -r assets /tmp/src/
          cp pubspec.yaml /tmp/src/
          flutter create . --project-name nft_wl_tracker --platforms android
          rm -rf lib assets pubspec.yaml
          cp -r /tmp/src/lib .
          cp -r /tmp/src/assets .
          cp /tmp/src/pubspec.yaml .

      - name: Install dependencies
        run: flutter pub get

      - name: Allow opening browser links (Android 11+ package visibility)
        run: |
          python3 - << 'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          queries_block = (
              '<queries><intent><action android:name="android.intent.action.VIEW" />'
              '<category android:name="android.intent.category.BROWSABLE" />'
              '<data android:scheme="https" /></intent></queries>'
          )

          if "android.intent.category.BROWSABLE" not in content:
              # Insert right before the <application ...> tag, regardless of
              # whitespace/newlines/attribute formatting around it.
              new_content, count = re.subn(r"<application", queries_block + "<application", content, count=1)
              if count == 0:
                  raise SystemExit("ERROR: could not find <application tag to insert queries block")
              content = new_content

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Queries block OK.")
          EOF

      - name: Set app display name
        run: |
          python3 - << 'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          new_content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="Jadwal Mint NFT"',
              content,
              count=1,
          )
          if count == 0:
              raise SystemExit("ERROR: could not find android:label attribute to replace")

          with open(path, "w", encoding="utf-8") as f:
              f.write(new_content)
          print("App label OK.")
          EOF

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nft-wl-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
